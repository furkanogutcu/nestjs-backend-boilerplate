services:
  tempo:
    image: grafana/tempo:2.6.1
    container_name: ${APP_NAME}-tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo/tempo.yaml', '-config.expand-env=true']
    environment:
      R2_S3_ENDPOINT: ${R2_S3_ENDPOINT}
      TEMPO_R2_BUCKET: ${TEMPO_R2_BUCKET}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      TEMPO_RETENTION: ${TEMPO_RETENTION}
    volumes:
      - ./docker/observability/tempo/tempo.production.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_wal:/var/tempo/wal
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: ${TEMPO_MEMORY_LIMIT}
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'

  loki:
    image: grafana/loki:3.2.1
    container_name: ${APP_NAME}-loki
    restart: unless-stopped
    command: ['-config.file=/etc/loki/loki.yaml', '-config.expand-env=true']
    environment:
      R2_S3_ENDPOINT: ${R2_S3_ENDPOINT}
      LOKI_R2_BUCKET: ${LOKI_R2_BUCKET}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      LOKI_RETENTION: ${LOKI_RETENTION}
    volumes:
      - ./docker/observability/loki/loki.production.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: ${LOKI_MEMORY_LIMIT}
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ${APP_NAME}-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--enable-feature=exemplar-storage'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}'
    volumes:
      - ./docker/observability/prometheus/prometheus.production.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - '10.0.0.1:${VPN_PROMETHEUS_PORT}:9090'
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEMORY_LIMIT}
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'

  alloy:
    image: grafana/alloy:v1.4.2
    container_name: ${APP_NAME}-alloy
    restart: unless-stopped
    command:
      - 'run'
      - '--server.http.listen-addr=0.0.0.0:12345'
      - '/etc/alloy/config.alloy'
    volumes:
      - ./docker/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: ${ALLOY_MEMORY_LIMIT}
    depends_on:
      - tempo
      - loki
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ${APP_NAME}-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '10.0.0.1:${VPN_GRAFANA_PORT}:3000'
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT}
    depends_on:
      - prometheus
      - tempo
      - loki
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'

volumes:
  tempo_wal:
  loki_data:
  prometheus_data:
  grafana_data:

networks:
  dokploy-network:
    external: true
