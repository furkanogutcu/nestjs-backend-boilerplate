services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: ${APP_NAME}-postgres:local
    container_name: ${APP_NAME}-db
    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT}
          cpus: '${DB_CPU_LIMIT}'
        reservations:
          memory: ${DB_MEMORY_RESERVATION}

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'

      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD}

      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_run:/var/run/postgresql
      - pgbackrest_log:/var/log/pgbackrest
      - pgbackrest_spool:/var/spool/pgbackrest

    ports:
      - '10.0.0.1:${VPN_DB_PORT}:5432'
    networks:
      - dokploy-network

    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c max_connections=200
      -c random_page_cost=1.1
      -c log_min_duration_statement=1000
      -c log_checkpoints=on
      -c log_timezone='UTC'
      -c timezone='UTC'
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c wal_keep_size=1GB
      -c wal_compression=on
      -c archive_mode=on
      -c archive_command='pgbackrest --stanza=main archive-push %p'
      -c archive_timeout=60
      -c checkpoint_completion_target=0.9

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: ${APP_NAME}-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: ${PGBOUNCER_MEMORY_LIMIT}
        reservations:
          memory: ${PGBOUNCER_MEMORY_RESERVATION}

    environment:
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD}
      PGBOUNCER_STATS_PASSWORD: ${PGBOUNCER_STATS_PASSWORD}

    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/entrypoint.sh:/usr/local/bin/render-userlist.sh:ro

    entrypoint: ['/usr/local/bin/render-userlist.sh']
    command: ['/usr/bin/pgbouncer', '/etc/pgbouncer/pgbouncer.ini']

    ports:
      - '10.0.0.1:${VPN_PGBOUNCER_PORT}:6432'
    networks:
      - dokploy-network

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 -U pgbouncer_stats || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'

  pgbackrest:
    image: woblerr/pgbackrest:2.58.0-alpine-v0.36
    container_name: ${APP_NAME}-pgbackrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE}

      BACKUP_SCHEDULE_FULL: '0 2 * * 0'
      BACKUP_SCHEDULE_DIFF: '0 3 * * 1-6'
      BACKUP_STANZA: main
      TZ: UTC

    volumes:
      - ./docker/pgbackrest/pgbackrest.conf.template:/etc/pgbackrest/pgbackrest.conf.template:ro
      - ./docker/pgbackrest/entrypoint.sh:/usr/local/bin/render-pgbackrest.sh:ro
      - postgres_data:/var/lib/postgresql/data:ro
      - postgres_run:/var/run/postgresql
      - pgbackrest_log:/var/log/pgbackrest
      - pgbackrest_spool:/var/spool/pgbackrest

    entrypoint: ['/usr/local/bin/render-pgbackrest.sh']

    networks:
      - dokploy-network

    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    container_name: ${APP_NAME}-postgres-exporter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATA_SOURCE_NAME: 'postgresql://exporter:${POSTGRES_EXPORTER_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable'
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: 'true'
      PG_EXPORTER_EXCLUDE_DATABASES: 'template0,template1'

    ports:
      - '10.0.0.1:${VPN_POSTGRES_EXPORTER_PORT}:9187'
    networks:
      - dokploy-network

    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9187/ >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  pgbouncer-exporter:
    image: quay.io/prometheuscommunity/pgbouncer-exporter:v0.12.0
    container_name: ${APP_NAME}-pgbouncer-exporter
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy

    command:
      - '--pgBouncer.connectionString=postgres://pgbouncer_stats:${PGBOUNCER_STATS_PASSWORD}@pgbouncer:6432/pgbouncer?sslmode=disable'

    ports:
      - '10.0.0.1:${VPN_PGBOUNCER_EXPORTER_PORT}:9127'
    networks:
      - dokploy-network

    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9127/ >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME}-redis
    restart: unless-stopped

    command: /bin/sh -c "redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory ${REDIS_MAXMEMORY} --maxmemory-policy noeviction"

    volumes:
      - redis_data:/data

    ports:
      - '10.0.0.1:${VPN_REDIS_PORT}:6379'

    networks:
      - dokploy-network

    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT}

    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'

volumes:
  postgres_data:
  postgres_run:
  pgbackrest_log:
  pgbackrest_spool:
  redis_data:

networks:
  dokploy-network:
    external: true
