services:
  redis:
    image: 'redis:alpine'
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - 6389:6379
  db:
    image: 'postgres:17-alpine'
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5442:5432
volumes:
  redis_data:
  postgres_data:
