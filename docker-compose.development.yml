services:
  redis:
    image: 'redis:alpine'
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - 6389:6379
  db:
    image: 'postgres:17-alpine'
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5442:5432
  minio:
    image: 'minio/minio:latest'
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - 9000:9000
      - 9001:9001
volumes:
  redis_data:
  postgres_data:
  minio_data:
