global:
  scrape_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: app
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['host.docker.internal:4001']
        labels:
          service: app

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
