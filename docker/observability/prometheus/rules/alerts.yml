groups:
  - name: app
    rules:
      - alert: AppDown
        expr: up{job="app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'app is down (no metrics scraped for 1m)'

      - alert: HighHttpErrorRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'HTTP 5xx error rate above 5% over the last 5m'

      - alert: HighHttpLatencyP99
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'HTTP p99 latency above 2s over the last 5m'

  - name: exporters
    rules:
      - alert: PostgresExporterDown
        expr: up{job="postgres-exporter"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'postgres-exporter is not being scraped (check the REPLACE_APP_NAME target in prometheus.production.yml)'

      - alert: PgbouncerExporterDown
        expr: up{job="pgbouncer-exporter"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'pgbouncer-exporter is not being scraped (check the REPLACE_APP_NAME target in prometheus.production.yml)'
