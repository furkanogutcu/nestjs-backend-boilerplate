[databases]
* = host=postgres port=5432 auth_user=pgbouncer_auth

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type        = scram-sha-256
auth_file        = /etc/pgbouncer/userlist.txt
auth_user        = pgbouncer_auth
auth_query       = SELECT username, password FROM public.user_lookup($1)

pool_mode               = transaction
max_client_conn         = 1000
default_pool_size       = 25
min_pool_size           = 5
reserve_pool_size       = 5
reserve_pool_timeout    = 3
max_db_connections      = 100
max_prepared_statements = 256

server_idle_timeout     = 600
server_lifetime         = 3600
server_connect_timeout  = 15
server_login_retry      = 5
query_wait_timeout      = 120
query_timeout           = 0
client_idle_timeout     = 0
client_login_timeout    = 60

client_tls_sslmode = prefer
server_tls_sslmode = prefer

admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

log_connections        = 0
log_disconnections     = 0
log_pooler_errors      = 1
stats_period           = 60

; libpq sends these on every connect; harmless under transaction pooling.
ignore_startup_parameters = extra_float_digits,search_path,application_name
